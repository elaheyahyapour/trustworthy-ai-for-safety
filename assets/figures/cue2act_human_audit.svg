<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FAFAF8"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#82909B" stroke-width="1.4"/></marker></defs>
<text x="90" y="75" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="700" fill="#26323C" text-anchor="start">Cue2Act | From evidence to human audit</text>
<text x="90" y="121" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#63717B" text-anchor="start">Two evidence inputs. One recommendation. Three distinct evaluation questions.</text>
<rect x="90" y="148" width="1740" height="3" rx="0" fill="#871C35" stroke="none" stroke-width="1.5"/>
<text x="90" y="194" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#28736F" text-anchor="start">WHAT THE DRIVER SEES</text>
<text x="1020" y="194" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#466B88" text-anchor="start">WHY THE SYSTEM INTERVENES</text>
<rect x="90" y="213" width="810" height="231" rx="16" fill="#EFF5F2" stroke="#D8E3DF" stroke-width="1.5"/>
<rect x="1020" y="213" width="810" height="231" rx="16" fill="#EEF3F7" stroke="#D7E1E9" stroke-width="1.5"/>
<text x="124" y="259" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#226762" text-anchor="start">Visible Hazard</text>
<text x="124" y="303" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#27343F" text-anchor="start">Scene-specific object or roadway condition</text>
<text x="124" y="342" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#27343F" text-anchor="start">that matters to the driving situation.</text>
<text x="124" y="400" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#46615E" text-anchor="start">Example: a lead vehicle in the same lane.</text>
<text x="1054" y="259" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#3F6380" text-anchor="start">Physical Trigger</text>
<text x="1054" y="303" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#27343F" text-anchor="start">A measurable or rule-based safety condition</text>
<text x="1054" y="342" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#27343F" text-anchor="start">that activates the intervention.</text>
<text x="1054" y="386" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#4F6475" text-anchor="start">Example: closing on the lead vehicle,</text>
<text x="1054" y="417" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#4F6475" text-anchor="start">with the gap below the configured minimum.</text>
<path d="M 495 444 V 471 Q 495 483 507 483 H 1413 Q 1425 483 1425 471 V 444" fill="none" stroke="#82909B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 960 483 V 516" fill="none" stroke="#82909B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="420" y="528" width="1080" height="160" rx="18" fill="#FFFFFF" stroke="#CDD5DA" stroke-width="1.5"/>
<text x="455" y="564" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#63717B" text-anchor="start">CUE2ACT RECOMMENDATION</text>
<rect x="455" y="587" width="155" height="64" rx="10" fill="#F5E4BD" stroke="none" stroke-width="1.5"/>
<text x="532" y="629" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#795514" text-anchor="middle">SLOW</text>
<text x="650" y="598" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="500" fill="#27343F" text-anchor="start">“Vehicle ahead is closing.</text>
<text x="650" y="634" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="500" fill="#27343F" text-anchor="start">Increase following distance and prepare to brake.”</text>
<path d="M 960 688 V 716" fill="none" stroke="#82909B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="960" y="750" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#871C35" text-anchor="middle">HUMAN AUDIT CRITERIA</text>
<path d="M 960 763 V 778 M 370 800 V 778 H 1550 V 800 M 960 778 V 800" fill="none" stroke="#82909B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="90" y="813" width="560" height="210" rx="15" fill="#FFFFFF" stroke="#DCE1E4" stroke-width="1.5"/>
<rect x="680" y="813" width="560" height="210" rx="15" fill="#FFFFFF" stroke="#DCE1E4" stroke-width="1.5"/>
<rect x="1270" y="813" width="560" height="210" rx="15" fill="#FFFFFF" stroke="#DCE1E4" stroke-width="1.5"/>
<text x="120" y="853" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#871C35" text-anchor="start">01</text>
<text x="165" y="853" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#27343F" text-anchor="start">Faithfulness</text>
<text x="710" y="853" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#871C35" text-anchor="start">02</text>
<text x="755" y="853" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#27343F" text-anchor="start">Helpfulness</text>
<text x="1300" y="853" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#871C35" text-anchor="start">03</text>
<text x="1345" y="853" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#27343F" text-anchor="start">Novice Suitability</text>
<text x="120" y="895" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="500" fill="#871C35" text-anchor="start">Is it grounded and consistent?</text>
<text x="120" y="938" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#27343F" text-anchor="start">Matches the scene, physical evidence,</text>
<text x="120" y="973" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#27343F" text-anchor="start">and final governed action.</text>
<text x="710" y="895" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="500" fill="#871C35" text-anchor="start">Does it help the driver act?</text>
<text x="710" y="938" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#27343F" text-anchor="start">Provides relevant, actionable guidance</text>
<text x="710" y="973" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#27343F" text-anchor="start">for the current driving situation.</text>
<text x="1300" y="895" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="500" fill="#871C35" text-anchor="start">Can a novice understand and use it?</text>
<text x="1300" y="938" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#27343F" text-anchor="start">Uses clear, manageable language</text>
<text x="1300" y="973" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#27343F" text-anchor="start">suited to an inexperienced driver.</text>
<text x="90" y="1060" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#66747D" text-anchor="start">Illustrative following-distance scenario • Criteria assess the recommendation; evidence explains its basis.</text>
</svg>